- date: "2026-08-12"
  tag: award
  people: ["Fan Zhang", "Sarisht Wadhwa", "Aviv Yaish", "Zeyu (Thomas) Liu", "Charalampos Papamanthou"]
  text: |
    At [USENIX Security 2026](https://www.usenix.org/conference/usenixsecurity26/technical-sessions), YACL members presented three papers, and received the [USENIX Security Test of Time Award](https://www.usenix.org/conferences/test-of-time-awards)!
  details: |
    - [Perils of Parallelism: Transaction Fee Mechanisms under Execution Uncertainty](https://eprint.iacr.org/2026/649)
    - [InstantOMR: Oblivious Message Retrieval with Low Latency and Optimal Parallelizability](https://eprint.iacr.org/2025/2317)
    - [Efficiently Provable Approximations for Non-Polynomial Functions](https://www.usenix.org/conference/usenixsecurity26/presentation/sridhar)
    - [Stealing Machine Learning Models via Prediction APIs](https://www.usenix.org/conference/usenixsecurity16/technical-sessions/presentation/tramer)

